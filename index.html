<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f5f5f2">
  <meta name="description" content="A thoughtful, private workout tracker.">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Form">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <title>Form — Training, thoughtfully tracked</title>
  <link rel="manifest" href="manifest.json">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  <link rel="stylesheet" href="style.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.7/dist/chart.umd.min.js" defer></script>
  <script src="form-domain.js" defer></script>
  <script src="script.js" defer></script>
</head>
<body>
  <div class="app-shell">
    <aside class="sidebar">
      <a class="brand" href="#" data-nav="dashboard" aria-label="Form home"><span class="brand-mark">f</span><span>form<span class="brand-period">.</span></span></a>
      <div class="side-label">WORKSPACE</div>
      <nav class="side-nav" aria-label="Main navigation">
        <button class="nav-item active" data-nav="dashboard"><span class="nav-icon">◫</span>Overview</button>
        <button class="nav-item" data-nav="workout"><span class="nav-icon">＋</span>Workout</button>
        <button class="nav-item" data-nav="routines"><span class="nav-icon">▤</span>Routines</button>
        <button class="nav-item" data-nav="history"><span class="nav-icon">◷</span>History</button>
        <button class="nav-item" data-nav="progress"><span class="nav-icon">↗</span>Progress</button>
        <button class="nav-item" data-nav="library"><span class="nav-icon">⌕</span>Exercises</button>
      </nav>
      <div class="sidebar-bottom">
        <div class="privacy-note"><span class="privacy-dot"></span><div><strong>Your data stays yours</strong><small>Saved on this device only</small></div></div>
        <button class="profile-button" data-nav="settings"><span class="avatar" id="avatar-initial">A</span><span><strong id="sidebar-name">Athlete</strong><small>Personal workspace</small></span><span class="more-icon">···</span></button>
      </div>
    </aside>
    <main class="main-area">
      <header class="topbar">
        <div class="breadcrumb"><span>Workspace</span><span class="crumb-slash">/</span><strong id="page-label">Overview</strong></div>
        <div class="top-actions"><span class="today-label" id="today-label"></span><button class="icon-button theme-toggle" title="Toggle theme" aria-label="Toggle theme">◐</button><button class="top-avatar" data-nav="settings" id="top-avatar" title="Settings" aria-label="Settings">⚙</button></div>
      </header>
      <div id="app-content" class="content" aria-live="polite"></div>
    </main>
  </div>
  <nav class="mobile-nav" aria-label="Mobile navigation">
    <button class="mobile-nav-item active" data-nav="dashboard"><span>◫</span>Home</button>
    <button class="mobile-nav-item" data-nav="workout"><span>＋</span>Train</button>
    <button class="mobile-nav-item" data-nav="routines"><span>▤</span>Routines</button>
    <button class="mobile-nav-item" data-nav="library"><span>⌕</span>Exercises</button>
    <button class="mobile-nav-item" data-nav="history"><span>◷</span>History</button>
    <button class="mobile-nav-item" data-nav="progress"><span>↗</span>Progress</button>
  </nav>
  <div id="toast-region" class="toast-region" aria-live="polite"></div>
  <dialog id="app-dialog" class="app-dialog"><div id="dialog-content"></div></dialog>
</body>
</html>
